<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zenit Beta - Bot Manager 24/7</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 600px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    .header h1 {
      font-size: 1.8rem;
      font-weight: 800;
      color: #f0f6fc;
      letter-spacing: -0.5px;
    }
    .header p {
      font-size: 0.9rem;
      color: #8b949e;
      margin-top: 4px;
    }
    .server-badge {
      display: inline-block;
      background: #21262d;
      border: 1px solid #30363d;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #58a6ff;
      margin-top: 10px;
    }
    .cards-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 20px;
    }
    @media (max-width: 480px) {
      .cards-grid { grid-template-columns: 1fr; }
    }
    .bot-card {
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 20px;
      position: relative;
      transition: transform 0.2s ease;
    }
    .bot-card:hover {
      transform: translateY(-2px);
    }
    .bot-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #f0f6fc;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #8b949e;
      box-shadow: 0 0 0 rgba(0,0,0,0);
    }
    .online .dot {
      background-color: #3fb950;
      box-shadow: 0 0 10px #3fb950;
      animation: pulse 2s infinite;
    }
    .offline .dot {
      background-color: #f85149;
      box-shadow: 0 0 8px #f85149;
    }
    .online .status-text { color: #3fb950; }
    .offline .status-text { color: #f85149; }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(63, 185, 80, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(63, 185, 80, 0); }
      100% { box-shadow: 0 0 0 0 rgba(63, 185, 80, 0); }
    }

    .footer {
      margin-top: 28px;
      text-align: center;
      font-size: 0.8rem;
      color: #8b949e;
      border-top: 1px solid #21262d;
      padding-top: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Panel de Control 24/7</h1>
      <p>Monitoreo en tiempo real para Aternos</p>
      <div class="server-badge" id="serverIp">1.26.50.5:45026</div>
    </div>

    <div class="cards-grid">
      <!-- Bot 1 -->
      <div class="bot-card" id="card-bot1">
        <div class="bot-title">
          <span>Chino 2334</span>
        </div>
        <div class="status-indicator offline" id="status-bot1">
          <div class="dot"></div>
          <span class="status-text">Desconectado</span>
        </div>
      </div>

      <!-- Bot 2 -->
      <div class="bot-card" id="card-bot2">
        <div class="bot-title">
          <span>elpapu3196</span>
        </div>
        <div class="status-indicator offline" id="status-bot2">
          <div class="dot"></div>
          <span class="status-text">Desconectado</span>
        </div>
      </div>
    </div>

    <div class="footer">
      Sincronizado dinámicamente cada 5 segundos • UptimeRobot Ready
    </div>
  </div>

  <script>
    async function updateDashboard() {
      try {
        const response = await fetch('/api/status');
        const data = await response.json();

        // Actualizar Bot 1
        updateBotUI('bot1', data.bot1);
        // Actualizar Bot 2
        updateBotUI('bot2', data.bot2);

      } catch (err) {
        console.error('Error obteniendo estado:', err);
      }
    }

    function updateBotUI(botKey, botData) {
      if (!botData) return;
      const statusElement = document.getElementById(`status-${botKey}`);
      const isOnline = botData.status === 'online';

      if (isOnline) {
        statusElement.className = 'status-indicator online';
        statusElement.querySelector('.status-text').textContent = 'En línea';
      } else {
        statusElement.className = 'status-indicator offline';
        statusElement.querySelector('.status-text').textContent = 'Desconectado';
      }
    }

    // Actualizar inmediatamente y luego cada 5 segundos
    updateDashboard();
    setInterval(updateDashboard, 5000);
  </script>
</body>
</html>
